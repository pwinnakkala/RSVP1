name: Deploy to AWS

# Every push to main builds the site, uploads it to S3 and invalidates CloudFront.
# The CloudFormation stack is only updated when files under infra/ change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_NAME: praveen-rsvp

jobs:
  infra:
    name: CloudFormation Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect infra changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             git diff --name-only HEAD~1 HEAD | grep -q '^infra/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy stack
        if: steps.changes.outputs.infra == 'true'
        working-directory: infra
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ARTIFACT_BUCKET="praveen-rsvp-s3-artifacts-$ACCOUNT_ID"
          aws cloudformation package \
            --template-file wedding.yaml \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --output-template-file packaged.yaml
          aws cloudformation deploy \
            --template-file packaged.yaml \
            --stack-name "$STACK_NAME" \
            --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              NotificationEmail="${{ secrets.NOTIFICATION_EMAIL }}" \
              CoupleEmail="${{ secrets.COUPLE_EMAIL }}" \
              AdminPasswordHash="${{ secrets.ADMIN_PASSWORD_HASH }}" \
              AuthSecret="${{ secrets.AUTH_SECRET }}"

  deploy-site:
    name: Build & Deploy Site
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Look up stack outputs
        id: out
        run: |
          q() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "bucket=$(q SiteBucket)" >> "$GITHUB_OUTPUT"
          echo "dist=$(q DistributionId)" >> "$GITHUB_OUTPUT"

      - name: Sync static assets (long cache)
        run: |
          aws s3 sync out/ "s3://${{ steps.out.outputs.bucket }}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" --exclude "*.json"

      - name: Sync HTML & JSON (no cache)
        run: |
          aws s3 sync out/ "s3://${{ steps.out.outputs.bucket }}/" \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" --include "*.html" --include "*.json"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.out.outputs.dist }}" \
            --paths "/*"
